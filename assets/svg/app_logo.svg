<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#997A15"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#F3E5AB"/>
      <stop offset="100%" stop-color="#AA8820"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Monogram Logo: T and D Interwoven -->
  <g transform="translate(140, 40)" filter="url(#subtleGlow)">
    <!-- T Stem -->
    <path d="M 50 15 L 50 135 C 50 138 48 140 45 140 C 42 140 40 138 40 135 L 40 25 L 15 25 C 12 25 10 23 10 20 C 10 17 12 15 15 15 Z" fill="url(#goldGrad)" />
    
    <!-- D Curve -->
    <path d="M 55 15 C 95 15 125 40 125 75 C 125 110 95 135 55 135 L 55 123 C 88 123 112 102 112 75 C 112 48 88 27 55 27 Z" fill="url(#goldGrad)" />
    
    <!-- Accent Dot on D -->
    <circle cx="127" cy="40" r="5" fill="url(#goldGrad)"/>
  </g>

  <!-- Brand Title: TIMELESS -->
  <text x="200" y="240" font-family="'Cinzel', 'Times New Roman', 'Georgia', serif" font-size="34" font-weight="500" letter-spacing="10" fill="url(#goldGrad)" text-anchor="middle">TIMELESS</text>

  <!-- Subtitle: — DETAILING — -->
  <g transform="translate(0, 275)">
    <!-- Left Line -->
    <line x1="90" y1="0" x2="140" y2="0" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round"/>
    
    <!-- Detailing Text -->
    <text x="200" y="4" font-family="'Montserrat', 'Arial', sans-serif" font-size="12" font-weight="600" letter-spacing="7" fill="#8B7322" text-anchor="middle">DETAILING</text>
    
    <!-- Right Line -->
    <line x1="260" y1="0" x2="310" y2="0" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
